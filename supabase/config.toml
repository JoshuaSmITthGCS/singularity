project_id = "singularity-mvp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.external.github]
enabled = true
# Dedicated to the plain GitHub OAuth App used for login (CLAUDE.md §A1) —
# deliberately NOT GITHUB_APP_CLIENT_ID/SECRET, which name the separate
# GitHub App used for repo access + PR delivery (§A3). Reusing those names
# here would collide with that app's Netlify env vars.
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[storage]
enabled = true
file_size_limit = "50MiB"
